name: Gerar APK Som & História

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ZIP
        run: |
          mkdir projeto
          unzip -o SomHistoria_Prototipo_1_9_CORRIGIDO-3.zip -d projeto

      - name: Ativar AndroidX
        run: |
          GRADLE_PROPERTIES=$(find projeto -path '*/android/gradle.properties' -type f | head -n 1)
          if [ -z "$GRADLE_PROPERTIES" ]; then
            echo "ERRO: gradle.properties não encontrado."
            exit 1
          fi
          echo "android.useAndroidX=true" >> "$GRADLE_PROPERTIES"
          echo "android.enableJetifier=true" >> "$GRADLE_PROPERTIES"
          echo "AndroidX ativado em: $GRADLE_PROPERTIES"

      - name: Localizar projeto Android
        run: |
          find projeto -name gradlew -type f -exec chmod +x {} \;
      
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        working-directory: projeto
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado no projeto."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SomHistoria-APK
          path: projeto/**/build/outputs/apk/**/*.apk
